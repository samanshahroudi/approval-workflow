[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "approval-incident-workflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "pydantic>=2,<3", "langgraph>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["approval_workflow*"]

[tool.ruff]
line-length = 100
